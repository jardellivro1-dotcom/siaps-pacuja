name: Atualizar dados do Siaps

on:
  schedule:
    - cron: "0 9 12 * *" # dia 12 de cada mês (envio ao Siaps vai até o dia 10; ver NT 8/2026, item 2.7)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python -m siaps_pacuja update
      - name: Commit se houver novos dados
        run: |
          git config user.name "siaps-bot"
          git config user.email "siaps-bot@users.noreply.github.com"
          git add data dashboard
          git diff --cached --quiet || (git commit -m "chore: atualiza dados públicos do Siaps (Pacujá)" && git push)
      - name: Abrir issue se a automação falhar (API fora do ar ou formato mudou)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Falha na atualização automática do Siaps" \
            --body "A execução ${{ github.run_id }} falhou. Veja: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Possíveis causas: portal fora do ar ou mudança no formato da API pública."
