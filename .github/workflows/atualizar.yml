name: Atualizar dados do Siaps

on:
  schedule:
    - cron: "0 9 12 * *" # dia 12 de cada mês (envio ao Siaps vai até o dia 10; ver NT 8/2026, item 2.7)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python -m siaps_pacuja update
      - run: python -m siaps_pacuja status
      - name: Abrir PR com os dados (a main exige PR e verificações)
        run: |
          git config user.name "siaps-bot"
          git config user.email "siaps-bot@users.noreply.github.com"
          git add data dashboard
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          RAMO="dados/atualizacao-$(date -u +%Y%m%d-%H%M)"
          git switch -c "$RAMO"
          git commit -m "chore: atualiza dados públicos do Siaps (Pacujá)"
          git push -u origin "$RAMO"
          gh pr create --base main --head "$RAMO"             --title "Atualização dos dados do Siaps ($(date -u +%Y-%m-%d))"             --body "Coleta automática. Confira \`data/manifest.json\` (revisões, SHA-256) antes de mesclar. Se algum período mudou, a versão anterior está em \`data/raw/revisoes/\`."
          # PRs abertos com GITHUB_TOKEN não disparam a CI sozinhos; o disparo manual atende às verificações obrigatórias
          gh workflow run ci.yml --ref "$RAMO"
      - name: Abrir issue se a automação falhar (API fora do ar ou formato mudou)
        if: failure()
        run: |
          gh issue create --title "Falha na atualização automática do Siaps"             --body "A execução ${{ github.run_id }} falhou. Veja: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Possíveis causas: portal fora do ar ou mudança no formato da API pública."
