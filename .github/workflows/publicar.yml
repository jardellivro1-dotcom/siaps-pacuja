name: Publicar painel (GitHub Pages)

# Publica só a pasta estática dashboard/ (sem servidor, sem endpoint de escrita), via HTTPS.
# Dispara (1) ao criar uma tag vX.Y.Z, (2) quando dados/painel mudam na main (PR mensal de dados mesclado)
# e (3) manualmente. Para REVERTER: rode manualmente escolhendo a tag anterior (campo "Use workflow from").
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["dashboard/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          ruff check .
          mypy
          coverage run -m unittest discover -s tests
          coverage report
        env:
          PYTHONPATH: src
      - name: A tag precisa coincidir com a versão do app
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSAO=$(python -c "import sys; sys.path.insert(0,'src'); from siaps_pacuja import config; print(config.VERSAO_APP)")
          [ "${GITHUB_REF_NAME}" = "v${VERSAO}" ] || { echo "Tag ${GITHUB_REF_NAME} != v${VERSAO}"; exit 1; }
  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - uses: actions/deploy-pages@v4
