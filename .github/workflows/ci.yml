name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff mypy coverage
      - name: Lint e formatação
        run: |
          ruff check .
          ruff format --check .
      - name: Tipagem
        run: mypy
      - name: Testes + cobertura mínima
        run: |
          coverage run -m unittest discover -s tests
          coverage report
        env:
          PYTHONPATH: src
