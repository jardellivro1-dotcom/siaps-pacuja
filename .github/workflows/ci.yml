name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # usado pelo workflow de atualização para validar o PR de dados

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint (inclui regras de segurança) e formatação
        run: |
          ruff check .
          ruff format --check .
      - name: Tipagem estrita
        run: mypy
      - name: Auditoria de vulnerabilidades das ferramentas de desenvolvimento
        run: pip-audit -r requirements-dev.txt
      - name: Testes + cobertura mínima (falha abaixo de 85%)
        run: |
          coverage run -m unittest discover -s tests
          coverage report
        env:
          PYTHONPATH: src

  compatibilidade:
    # O painel roda na máquina da gestão (Windows) e em Linux/Mac: testa versões do Python e sistemas.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
